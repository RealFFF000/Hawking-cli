# Hawking CLI runtime configuration
server.base_url: "https://hawking.computing.dcu.ie/hawking"
server.login_url: "https://hawking.computing.dcu.ie/login"
server.origin: "https://hawking.computing.dcu.ie"
api.base_url: "https://hawking.computing.dcu.ie/api"

update.repository: "https://github.com/RealFFF000/Hawking-cli"
update.branch: "main"
update.check_interval_seconds: 604800
update.check_file: "$HOME/.hawking_last_update"

session.cookie_file: "$HOME/.hawking_cookie"
session.user_file: "$HOME/.hawking_user"
session.cache_file: "$HOME/.hawking_history"
session.cookie_ttl_seconds: 7200

network.connect_timeout_seconds: 5
network.healthcheck_timeout_seconds: 4

file_selection.ignore_extensions: ".out,.exe,.o,.log"
file_selection.ignore_hidden: true
file_selection.ignore_script: "hawking.sh"
